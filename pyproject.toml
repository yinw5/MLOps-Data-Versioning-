[project]
name = "data-versioning-assignment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "numpy<2",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tensorflow==2.15.1",
    "tensorflow-privacy==0.9.0",
    "dvc",
    "ruff",
    "pylint",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pylint.main]
# tf.keras is lazily loaded, which pylint cannot see (false-positive no-member).
ignored-modules = ["tensorflow"]
disable = ["wrong-import-position", "too-many-locals"]
